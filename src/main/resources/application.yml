server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: bloghash

  datasource:
    url: jdbc:postgresql://172.17.0.2:5432/bloghashdb
    username: postgres
    password: mysecretpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: create  
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100  

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true 

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:} 
      
  output:
    ansi:
      enabled: always

# ═══════════════════════════════════
#         APP CUSTOM CONFIG
# ═══════════════════════════════════
app:
  jwt:
    private-key: classpath:keys/jwt-private.pem
    public-key: classpath:keys/jwt-public.pem
    access-token-expiration: 900000 # 15 minutes
    refresh-token-expiration: 604800000 # 7 days

  oauth2:
    redirect-uri-after-login: ${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/callback}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  security:
    max-login-attempts: 5
    lock-account-duration-minutes: 30

  post:
    default-page-size: 10
    max-page-size: 50

# ═══════════════════════════════════
#              LOGGING
# ═══════════════════════════════════
logging:
  level:
    com.codencanvas: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%5p){highlight} %clr([%15.15t]){faint} %clr(%-30logger{0}){cyan} %clr(:){faint} %m%n"

# ═══════════════════════════════════
#           API DOCUMENTATION
# ═══════════════════════════════════
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html 
  show-actuator: false
